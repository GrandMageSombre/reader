org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 依赖（Compose 1.12 / AndroidX 2026 版）要求 compileSdk 37；AGP 9.1 只是“未测试”警告
android.suppressUnsupportedCompileSdk=37,37.0
# AGP 9 下沿用经典 DSL / 关闭内置 Kotlin，与 Desktop/player 已验证的配置一致
android.newDsl=false
android.builtInKotlin=false
# 本机 Gradle/AGP 组合下 Kotlin 增量缓存偶发损坏（Could not close incremental caches）
kotlin.incremental=false
kotlin.code.style=official
